<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Relay 管理后台</title>
<style>
:root{--primary:#4f46e5;--primary-h:#4338ca;--success:#10b981;--warning:#f59e0b;--error:#ef4444;--bg:#f3f4f6;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--side-bg:#1e293b;--side-text:#cbd5e1;--side-active:#4f46e5;--r:12px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--sh-lg:0 10px 15px -3px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{cursor:pointer;text-decoration:none}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.login-card{background:#fff;padding:40px;border-radius:20px;box-shadow:var(--sh-lg);width:380px;text-align:center}
.login-card h1{font-size:26px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.login-card p{color:var(--muted);margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:16px;margin-bottom:16px}
.login-card input:focus{outline:none;border-color:var(--primary)}
.login-card button{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.login-card button:hover{background:var(--primary-h)}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--side-bg);color:var(--side-text);position:fixed;height:100vh;overflow-y:auto}
.sidebar-header{padding:20px;font-size:17px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar nav{padding:12px 0}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--side-text);transition:all .2s;font-size:14px}
.sidebar nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar nav a.active{background:var(--side-active);color:#fff}
.sidebar-footer{position:absolute;bottom:0;width:100%;padding:16px 20px;font-size:12px;color:var(--muted);border-top:1px solid rgba(255,255,255,.1)}
.content{margin-left:220px;flex:1;padding:24px;max-width:1400px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.stat-card .label{color:var(--muted);font-size:13px;margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .icon{float:right;color:var(--primary);opacity:.35}
.stat-card .icon svg{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.9}
.btn-danger{background:var(--error);color:#fff}.btn-danger:hover{opacity:.9}
.btn-warning{background:var(--warning);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:500;margin-bottom:6px;font-size:13px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary)}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{display:none}
.toggle .switch{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;transition:background .2s}
.toggle .switch::after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .switch{background:var(--success)}
.toggle input:checked + .switch::after{transform:translateX(18px)}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge-running,.badge-logged_in,.badge-sent{background:#d1fae5;color:#065f46}
.badge-stopped,.badge-logged_out{background:#f3f4f6;color:#6b7280}
.badge-error,.badge-failed{background:#fee2e2;color:#991b1b}
.badge-paused,.badge-qr_pending,.badge-queued{background:#fef3c7;color:#92400e}
.badge-info{background:#dbeafe;color:#1e40af}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:10px 14px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);font-size:12px;color:var(--muted);font-weight:600}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:var(--bg)}
.pair-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pair-card .info h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pair-card .info p{color:var(--muted);font-size:13px}
.pair-card .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qr-display{text-align:center;padding:20px}
.qr-display img{max-width:240px;border-radius:12px;border:1px solid var(--border)}
.qr-display .status{margin-top:12px;font-size:14px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-weight:500;z-index:9999;box-shadow:var(--sh-lg);animation:slideIn .3s;max-width:420px}
.toast-success{background:var(--success)}
.toast-error{background:var(--error)}
.toast-info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(400px)}to{transform:translateX(0)}}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty .icon{color:var(--primary);opacity:.25;margin-bottom:12px}
.empty .icon svg{width:48px;height:48px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag-item{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#eef2ff;color:var(--primary);border-radius:16px;font-size:13px}
.tag-item .remove{cursor:pointer;font-weight:bold;opacity:.6}
.tag-item .remove:hover{opacity:1}
input[type=range]{width:100%;height:6px;background:var(--border);border-radius:3px;appearance:none;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:var(--primary);border-radius:50%;cursor:pointer}
.dialog-item{background:var(--bg);padding:12px;border-radius:8px;margin-bottom:8px}
.media-preview-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px}
.media-preview{background:var(--card);width:min(880px,100%);max-height:calc(100vh - 48px);overflow:auto;border-radius:var(--r);box-shadow:var(--sh-lg);padding:20px}
.media-preview img{display:block;max-width:100%;max-height:70vh;margin:16px auto;border-radius:8px}.media-preview audio{width:100%;margin:18px 0}.media-preview .unsupported{padding:28px;text-align:center;color:var(--muted);background:var(--bg);border-radius:8px;margin:16px 0}
.dialog-item .role{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.dialog-item .text{font-size:14px}
.divider{height:1px;background:var(--border);margin:16px 0}
.muted{color:var(--muted)}.small{font-size:12px}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gap-8{gap:8px}.gap-12{gap:12px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.icon{display:inline-flex;align-items:center}.icon svg{width:16px;height:16px}
.icon-lg svg{width:24px;height:24px}
.flow-box{background:#eef2ff;border-radius:8px;padding:12px;line-height:1.8;font-size:13px}
.resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.resource-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;transition:transform .1s,border .2s;border:2px solid transparent}
.resource-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.resource-card h4{font-size:15px;margin-bottom:6px}
.resource-card p{font-size:12px;color:var(--muted)}
.resource-card .meta{margin-top:10px;font-size:12px;color:var(--muted)}
.queue-item{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;margin-bottom:8px}
.health-ok{color:var(--success)}.health-bad{color:var(--error)}
</style>
</head>
<body>

  <symbol id="i-dash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>

<div id="app">
  <div v-if="toast.show" class="toast" :class="'toast-'+toast.type">{{ toast.message }}</div>

  <!-- Login -->
  <div v-if="!token" class="login-page">
    <div class="login-card">
      <h1><span class="icon icon-lg" v-html="ic('i-heart')"></span> Couple Relay</h1>
      <p>微信消息中继管理系统</p>
      <input v-model="loginPassword" type="password" placeholder="管理员密码" @keyup.enter="doLogin">
      <button @click="doLogin" :disabled="loggingIn"><span v-if="loggingIn" class="spinner"></span> 登录</button>
    </div>
  </div>

  <!-- Main App -->
  <div v-else class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="icon" v-html="ic('i-heart')"></span> Couple Relay</div>
      <nav>
        <a @click="goPage('dashboard')" :class="{active:page==='dashboard'}"><span class="icon" v-html="ic('i-dash')"></span> 仪表盘</a>
        <a @click="goPage('pairs')" :class="{active:page==='pairs'||page==='pair'}"><span class="icon" v-html="ic('i-pairs')"></span> 配对管理</a>
        <a @click="goPage('ai-models')" :class="{active:page==='ai-models'}"><span class="icon" v-html="ic('i-ai')"></span> AI 模型</a>
        <a @click="goPage('personas')" :class="{active:page==='personas'}"><span class="icon" v-html="ic('i-persona')"></span> 人格</a>
        <a @click="goPage('worldbooks')" :class="{active:page==='worldbooks'}"><span class="icon" v-html="ic('i-book')"></span> 世界书</a>
        <a @click="goPage('keyword-sets')" :class="{active:page==='keyword-sets'}"><span class="icon" v-html="ic('i-key')"></span> 关键词集</a>
        <a @click="goPage('tool-sets')" :class="{active:page==='tool-sets'}"><span class="icon" v-html="ic('i-ai')"></span> 工具触发词</a>
        <a @click="goPage('media-library')" :class="{active:page==='media-library'}"><span class="icon" v-html="ic('i-msg')"></span> 媒体库</a>
        <a @click="goPage('settings')" :class="{active:page==='settings'}"><span class="icon" v-html="ic('i-gear')"></span> 系统设置</a>
      </nav>
      <div class="sidebar-footer">v1.1.0</div>
    </aside>

    <main class="content">
      <!-- ================= Dashboard ================= -->
      <template v-if="page==='dashboard'">
        <h2 style="margin-bottom:20px">仪表盘</h2>
        <div class="stats-grid">
          <div class="stat-card"><div class="icon" v-html="ic('i-pairs')"></div><div class="label">配对总数</div><div class="value">{{ dash.pairs||0 }}</div></div>
          <div class="stat-card"><div class="icon" v-html="ic('i-play')"></div><div class="label">运行中</div><div class="value" style="color:var(--success)">{{ dash.running||0 }}</div></div>
          <div class="stat-card"><div class="icon" v-html="ic('i-phone')"></div><div class="label">在线账号</div><div class="value">{{ dash.accounts_online||0 }}</div></div>
          <div class="stat-card"><div class="icon" v-html="ic('i-msg')"></div><div class="label">今日消息</div><div class="value">{{ dash.messages_today||0 }}</div></div>
          <div class="stat-card"><div class="icon" v-html="ic('i-ai')"></div><div class="label">今日AI回复</div><div class="value" style="color:var(--primary)">{{ dash.ai_today||0 }}</div></div>
        </div>
        <div class="card">
          <div class="card-title">配对状态概览</div>
          <div v-if="(dash.pairs_list||[]).length===0" class="empty"><div class="icon" v-html="ic('i-pairs')"></div><p>还没有配对，去创建一个吧</p></div>
          <table v-else>
            <thead><tr><th>名称</th><th>状态</th><th>账号A</th><th>账号B</th><th>今日消息</th><th>操作</th></tr></thead>
            <tbody>

            <div class="form-group"><label>消息方向</label>
              <select v-model="newPairDir"><option value="bidirectional">双向 (A↔B)</option><option value="a_to_b">A→B 单向</option><option value="b_to_a">B→A 单向</option></select>

            <p>{{ p.description||'无描述' }} · 模型: {{ p.ai_model_name||'-' }} · 人格: {{ p.persona_name||'-' }} · 今日: {{ (p.message_stats||{}).today||0 }} 条</p>

          <div class="actions">
            <button class="btn btn-sm btn-primary" @click="openPair(p.id)">管理</button>
            <button v-if="p.status!=='running'" class="btn btn-sm btn-success" @click="startPair(p.id)"><span class="icon" v-html="ic('i-play')"></span> 启动</button>
            <button v-else class="btn btn-sm btn-warning" @click="stopPair(p.id)"><span class="icon" v-html="ic('i-stop')"></span> 停止</button>
            <button class="btn btn-sm btn-outline" @click="clonePair(p.id)"><span class="icon" v-html="ic('i-clone')"></span></button>
            <button class="btn btn-sm btn-danger" @click="deletePair(p.id)"><span class="icon" v-html="ic('i-trash')"></span></button>
          </div>
        </div>
      </template>

      <!-- ================= Pair Detail ================= -->
      <template v-if="page==='pair' && pair.id">
        <div class="flex-between mb-16">

            </div>

                <p class="muted small">Bot ID: {{ acc.bot_id||'-' }}</p>
                <p class="muted small">微信ID: {{ acc.wxid||'-' }}</p>
                <p class="muted small">最后活跃: {{ acc.last_active||'-' }}</p>

                <div class="status" v-if="qrStatus==='confirmed'" style="color:var(--success)">登录成功!</div>
                <div class="status" v-if="qrStatus==='expired'" style="color:var(--error)">二维码已过期</div>

        <!-- Resources -->
        <div v-if="tab==='resources'">
          <div class="card">
            <div class="card-title">资源引用配置</div>
            <p class="muted small mb-16">AI 模型 / 人格 / 世界书 / 关键词集 / 工具触发词都在左侧对应菜单中管理，这里只选择本配对使用哪一套。</p>
            <div class="form-group"><label>AI 模型</label>
              <select v-model="pair.ai_model_id" @change="savePairResources">
                <option :value="null">— 不使用 —</option>
                <option v-for="m in aiModels" :key="m.id" :value="m.id">{{ m.name }} ({{ m.model }})</option>
              </select>
            </div>
            <div class="form-group"><label>人格 / 角色卡</label>
              <select v-model="pair.persona_id" @change="savePairResources">
                <option :value="null">— 不使用 —</option>
                <option v-for="p in personas" :key="p.id" :value="p.id">{{ p.name }}</option>
              </select>
            </div>
            <div class="form-group"><label>世界书</label>
              <select v-model="pair.worldbook_id" @change="savePairResources">
                <option :value="null">— 不使用 —</option>
                <option v-for="wb in worldbooks" :key="wb.id" :value="wb.id">{{ wb.name }}</option>
              </select>
            </div>
            <div class="form-group"><label>关键词集</label>
              <select v-model="pair.keyword_set_id" @change="savePairResources">
                <option :value="null">— 不使用 —</option>
                <option v-for="ks in keywordSets" :key="ks.id" :value="ks.id">{{ ks.name }}</option>
              </select>
            </div>
            <div class="form-group"><label>工具触发词集 <span class="muted small">(命中后调用工具，再由当前人格自然回复)</span></label>
              <select v-model="pair.tool_set_id" @change="savePairResources">
                <option :value="null">— 不使用 —</option>
                <option v-for="ts in toolSets" :key="ts.id" :value="ts.id">{{ ts.name }}</option>
              </select>
            </div>
            <div class="form-group"><label>视觉 AI 模型 <span class="muted small">(图片识别 + 语音转文字)</span></label>
              <select v-model="pair.vision_model_id" @change="savePairResources">
                <option :value="null">— 不使用 (图片/语音不触发AI) —</option>
                <option v-for="m in aiModels" :key="m.id" :value="m.id">{{ m.name }} ({{ m.model }})</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Messages -->
        <div v-if="tab==='messages'">
          <div class="card">
            <div class="card-title">
              <span class="flex"><span class="icon" v-html="ic('i-msg')"></span> 消息记录</span>
              <div class="flex gap-8">
                <button class="btn btn-sm" :class="msgFilter==='all'?'btn-primary':'btn-outline'" @click="msgFilter='all';loadMessages()">全部</button>
                <button class="btn btn-sm" :class="msgFilter==='A'?'btn-primary':'btn-outline'" @click="msgFilter='A';loadMessages()">A 发出</button>
                <button class="btn btn-sm" :class="msgFilter==='B'?'btn-primary':'btn-outline'" @click="msgFilter='B';loadMessages()">B 发出</button>
                <button class="btn btn-sm" :class="msgFilter==='ai'?'btn-primary':'btn-outline'" @click="msgFilter='ai';loadMessages()">仅AI</button>
                <button class="btn btn-sm btn-outline" @click="loadMessages"><span class="icon" v-html="ic('i-refresh')"></span></button>
              </div>
            </div>
            <p class="muted small mb-16">总计 {{ (msgStats||{}).total||0 }} 条 · AI {{ (msgStats||{}).ai||0 }} 条 · 今日 {{ (msgStats||{}).today||0 }} 条</p>
            <div v-if="messages.length===0" class="empty"><div class="icon" v-html="ic('i-msg')"></div><p>暂无消息记录</p></div>
            <table v-else>
              <thead><tr><th>时间</th><th>方向</th><th>发送者</th><th>内容</th><th>状态</th></tr></thead>
              <tbody>
                <tr v-for="m in messages" :key="m.id">
                  <td class="small">{{ m.timestamp }}</td>
                  <td><span class="badge" :class="m.direction==='A_to_B'?'badge-info':'badge-running'">{{ m.direction }}</span></td>
                  <td>{{ m.sender }}<span v-if="m.ai_generated" class="badge badge-info" style="margin-left:4px">AI</span></td>
                  <td>{{ m.content.length>60?m.content.slice(0,60)+'...':m.content }}</td>
                  <td><span class="badge" :class="statusBadge(m.status)" :title="m.status">{{ statusShort(m.status) }}</span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="card">
            <div class="card-title">手动发送消息</div>
            <div class="form-row">
              <div class="form-group" style="flex:1"><label>方向</label><select v-model="manualMsg.direction"><option value="A_to_B">A → B</option><option value="B_to_A">B → A</option></select></div>
              <div class="form-group" style="flex:3"><label>消息内容</label><input v-model="manualMsg.text" placeholder="输入消息..." @keyup.enter="sendMessage"></div>
            </div>
            <button class="btn btn-primary" @click="sendMessage">发送</button>
            <p v-if="pair.status!=='running'" class="hint" style="color:var(--warning)">配对未运行, 无法发送消息</p>
          </div>
        </div>

        <!-- Queue -->
        <div v-if="tab==='queue'">
          <div class="card">
            <div class="card-title">
              <span class="flex"><span class="icon" v-html="ic('i-queue')"></span> 发送队列与连接状态</span>
              <div class="flex gap-8">
                <label class="toggle"><input type="checkbox" v-model="queueAuto" @change="toggleQueueAuto"><span class="switch"></span> 自动刷新</label>
                <button class="btn btn-sm btn-outline" @click="loadQueue"><span class="icon" v-html="ic('i-refresh')"></span> 刷新</button>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>账号A 连接状态</label>
                <p :class="queue.client_a_ready?'health-ok':'health-bad'">{{ queue.client_a_ready?'正常':'异常/未就绪' }}</p>
                <p class="hint" v-if="queue.client_a_error" style="color:var(--error)">{{ queue.client_a_error }}</p>
                <p class="hint">最近收到: {{ fmtTime(queue.client_a_last_recv) }} · 最近发送: {{ fmtTime(queue.client_a_last_send) }}</p>
              </div>
              <div class="form-group">
                <label>账号B 连接状态</label>
                <p :class="queue.client_b_ready?'health-ok':'health-bad'">{{ queue.client_b_ready?'正常':'异常/未就绪' }}</p>
                <p class="hint" v-if="queue.client_b_error" style="color:var(--error)">{{ queue.client_b_error }}</p>
                <p class="hint">最近收到: {{ fmtTime(queue.client_b_last_recv) }} · 最近发送: {{ fmtTime(queue.client_b_last_send) }}</p>
              </div>
            </div>
            <div class="divider"></div>
            <h4 class="mb-8">待发队列 ({{ queue.outbox_size||0 }} 条)</h4>
            <p class="hint mb-16">网络等临时失败会自动退避重试。遇到 iLink 连续下行窗口限制时，消息会保持排队、不计重试；仅在目标账号收到新消息或发送刷新命令后冲刷。</p>
            <div v-if="(queue.outbox||[]).length===0" class="empty"><div class="icon" v-html="ic('i-queue')"></div><p>队列为空, 所有消息均已送达</p></div>
            <div v-for="(q,i) in (queue.outbox||[])" :key="i" class="queue-item">
              <div class="flex-between">
                <strong>→ {{ q.target }}</strong>
                <span class="badge badge-queued">{{ q.waiting_reason?'等待对方入站':'重试 '+q.attempts+' 次' }}</span>
              </div>
              <p class="mt-8">{{ q.text }}</p>
              <p class="hint" v-if="q.waiting_reason" style="color:var(--warning)">{{ q.waiting_reason }}</p>
              <p class="hint" v-if="q.last_error" :style="{color:q.waiting_reason?'var(--muted)':'var(--error)'}">原因: {{ q.last_error }}</p>
              <p class="hint">入队时间: {{ q.enqueued_at }}</p>
            </div>
          </div>
        </div>

        <!-- Logs -->
        <div v-if="tab==='logs'">
          <div class="card">
            <div class="card-title">
              <span class="flex"><span class="icon" v-html="ic('i-log')"></span> 系统日志</span>
              <div class="flex gap-8">
                <label class="toggle"><input type="checkbox" v-model="autoRefresh" @change="toggleAutoRefresh"><span class="switch"></span> 自动刷新</label>
                <button class="btn btn-sm btn-outline" @click="loadLogs"><span class="icon" v-html="ic('i-refresh')"></span></button>
              </div>
            </div>
            <div v-if="logs.length===0" class="empty"><div class="icon" v-html="ic('i-log')"></div><p>暂无日志</p></div>
            <table v-else>
              <thead><tr><th>时间</th><th>级别</th><th>消息</th></tr></thead>
              <tbody>
                <tr v-for="l in logs" :key="l.id">
                  <td class="small">{{ l.timestamp }}</td>
                  <td><span class="badge" :class="l.level==='ERROR'?'badge-error':l.level==='WARNING'?'badge-paused':'badge-info'">{{ l.level }}</span></td>
                  <td>{{ l.message }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Quiet Hours -->
        <div v-if="tab==='quiet'">
          <div class="card">
            <div class="card-title"><span class="flex"><span class="icon" v-html="ic('i-moon')"></span> 静默时段</span></div>
            <p class="muted small mb-16">在设定时间段内, 消息照常转发但跳过AI自动回复</p>
            <label class="toggle mb-16"><input type="checkbox" v-model="quietCfg.enabled"><span class="switch"></span> 启用静默时段</label>
            <div class="form-row">
              <div class="form-group"><label>开始时间</label><input type="time" v-model="quietCfg.start_time"></div>
              <div class="form-group"><label>结束时间</label><input type="time" v-model="quietCfg.end_time"></div>
            </div>
            <button class="btn btn-primary" @click="saveQuiet">保存</button>
          </div>
        </div>

        <!-- Pair Settings -->
        <div v-if="tab==='settings'">
          <div class="card">
            <div class="card-title">配对设置</div>
            <div class="form-group"><label>配对名称</label><input v-model="pair.name"></div>
            <div class="form-group"><label>描述</label><input v-model="pair.description"></div>
            <div class="form-row">
              <div class="form-group"><label>消息方向</label><select v-model="pair.direction"><option value="bidirectional">双向 (A↔B)</option><option value="a_to_b">A→B 单向</option><option value="b_to_a">B→A 单向</option></select></div>
              <div class="form-group"><label>AI 触发方</label>
                <select v-model="pair.ai_trigger_side">
                  <option value="B">B 触发 → AI回复给B, 合并同步给A</option>
                  <option value="A">A 触发 → AI回复给A, 合并同步给B</option>
                </select>
              </div>
            </div>
            <label class="toggle mb-16"><input type="checkbox" v-model="pair.ai_enabled"><span class="switch"></span> 启用 AI 自动回复</label>
              <label class="toggle mb-16"><input type="checkbox" v-model="pair.auto_start"><span class="switch"></span> 实例启动后自动启动此配对</label>
            <div class="form-row">
              <div class="form-group"><label>刷新发送窗口命令</label><input v-model="pair.refresh_window_command" placeholder="，，"><span class="hint">精确匹配；仅冲刷发给命令发送者的队列，不转发、不触发 AI。</span></div>
              <div class="form-group"><label>每窗口最大连续下行条数</label><input type="number" v-model.number="pair.max_consecutive_downlinks" min="1" max="8"><span class="hint">建议保持 8，低于微信约 10 条的限制。</span></div>
            </div>
            <div class="flow-box mb-16">
              <strong>消息流向：</strong><br>
              触发方(={{pair.ai_trigger_side||'B'}})发消息 → 正常转发给非触发方 + 触发AI<br>
              AI以【非触发方】口吻生成回复 → 分条发给触发方<br>
              合并版【第1条】【第2条】→ 同步给非触发方<br>
              非触发方发消息 → 取消待执行的AI（非触发方亲自回复了）<br>
              <span class="muted">AI上下文：触发方说的话=user，非触发方说的话=assistant</span>
            </div>
            <button class="btn btn-primary" @click="savePairSettings">保存设置</button>
          </div>
          <div class="card">
            <div class="card-title" style="color:var(--error)">危险操作</div>
            <div class="flex gap-8">
              <button class="btn btn-outline" @click="clonePair(pair.id)"><span class="icon" v-html="ic('i-clone')"></span> 克隆此配对</button>
              <button class="btn btn-danger" @click="deletePair(pair.id)"><span class="icon" v-html="ic('i-trash')"></span> 删除配对</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ================= AI Models ================= -->
      <template v-if="page==='ai-models'">
        <div class="flex-between mb-16">
          <h2>AI 模型</h2>
          <button class="btn btn-primary" @click="openAiModel()"><span class="icon" v-html="ic('i-plus')"></span> 新建模型</button>
        </div>
        <div v-if="aiModelEdit" class="card">
          <div class="card-title">{{ aiModelEdit.id?'编辑模型':'新建模型' }}</div>
          <div class="form-group"><label>快速预设</label>
            <select @change="applyAiPreset($event)">
              <option value="">— 选择预设或手动填写 —</option>
              <option v-for="(p,i) in aiPresets" :key="i" :value="i">{{ p.name }}</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group"><label>名称</label><input v-model="aiModelEdit.name" placeholder="如：DeepSeek 主账号"></div>
            <div class="form-group"><label>Provider</label><input v-model="aiModelEdit.provider"></div>

            <tr><td class="muted">数据库</td><td>SQLite (relay.db)</td></tr>
            <tr><td class="muted">部署方式</td><td>Docker / Python</td></tr>
          </table>
        </div>
      </template>
    </main>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const{createApp}=Vue;
createApp({
data(){return{
  token:localStorage.getItem('cr_token')||'',
  loginPassword:'',loggingIn:false,
  page:'dashboard',tab:'accounts',
  toast:{show:false,message:'',type:'info'},
  dash:{},pairs:[],pair:{},
  showCreatePair:false,newPairName:'',newPairDesc:'',newPairDir:'bidirectional',newPairTrigger:'B',
  qrImage:null,qrAccountId:null,qrStatus:'',qrTimer:null,
  // system resources
  aiModels:[],aiPresets:[],aiModelEdit:null,
  personas:[],personaEdit:null,newTag:'',newPersonality:'',newDialogUser:'',newDialogAssistant:'',
  worldbooks:[],worldbookEdit:null,newWb:{key:'',content:'',priority:0},
  keywordSets:[],keywordSetEdit:null,newKw:{keyword:'',reply:''},
  toolSets:[],toolSetEdit:null,toolsCatalog:[],newToolRule:{tool_name:'web_search',triggersText:'',match_mode:'prefix'},
  showImport:'',importText:'',
  // pair extras
  quietCfg:{enabled:false,start_time:'23:00',end_time:'07:00'},
  messages:[],msgStats:{},msgFilter:'all',manualMsg:{direction:'A_to_B',text:''},
  logs:[],autoRefresh:false,logTimer:null,
  queue:{},queueAuto:false,queueTimer:null,
  mediaItems:[],mediaTotal:0,mediaPreview:{open:false,url:'',kind:'',name:'',item:null},
  // settings
  pwForm:{old_password:'',new_password:''},
  sysCfg:{update_url:''},updating:false,updateStatus:{status:'',message:''},
  appVer:'',appBuild:'',
}},
async mounted(){if(this.token){await this.loadDashboard()}},
methods:{
  ic(n){return '<svg><use href="#'+n+'"></use></svg>'},
  async api(method,url,body,isForm){
    const opts={method,headers:{}};
    if(this.token)opts.headers['Authorization']='Bearer '+this.token;
    if(body&&!isForm){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
    if(body&&isForm){opts.body=body}
    try{
      const r=await fetch(url,opts);
      if(r.status===401){this.token='';localStorage.removeItem('cr_token');this.toastMsg('登录已过期','error');return null}
      const d=await r.json();
      if(!r.ok){this.toastMsg(d.detail||d.message||'操作失败','error');return null}
      return d;
    }catch(e){this.toastMsg('网络错误: '+e.message,'error');return null}
  },
  toastMsg(msg,type='info'){this.toast={show:true,message:msg,type};setTimeout(()=>this.toast.show=false,3500)},
  goPage(p){
    this.page=p;
    if(p==='dashboard')this.loadDashboard();
    if(p==='pairs')this.loadPairs();
    if(p==='ai-models'){this.loadAiModels();this.loadAiPresets()}
    if(p==='personas')this.loadPersonas();
    if(p==='worldbooks')this.loadWorldbooks();
    if(p==='keyword-sets')this.loadKeywordSets();
    if(p==='tool-sets'){this.loadToolSets();this.loadToolsCatalog()}
    if(p==='media-library')this.loadMediaLibrary();
    if(p==='settings'){this.loadSysCfg();this.loadVersion();this.loadUpdateStatus()}
  },
  accNick(p,i){return ((p.accounts||[])[i]||{}).nickname||'-'},
  accStatus(p,i){return ((p.accounts||[])[i]||{}).login_status||'logged_out'},
  statusShort(s){if(!s)return'sent';if(s==='sent')return'已送达';if(s==='queued')return'队列中';if(s.startsWith('failed'))return'失败';return s},
  statusBadge(s){if(!s||s==='sent')return'badge-sent';if(s==='queued')return'badge-queued';return'badge-failed'},
  fmtTime(ts){if(!ts)return'-';const d=new Date(ts*1000);const now=Date.now();const diff=(now-d.getTime())/1000;if(diff<60)return Math.floor(diff)+'秒前';if(diff<3600)return Math.floor(diff/60)+'分钟前';return d.toLocaleString()},

  // ===== Auth =====
  async doLogin(){
    if(!this.loginPassword){this.toastMsg('请输入密码','error');return}
    this.loggingIn=true;
    const d=await this.api('POST','/api/auth/login',{password:this.loginPassword});
    this.loggingIn=false;
    if(d&&d.token){this.token=d.token;localStorage.setItem('cr_token',d.token);this.loginPassword='';this.toastMsg('登录成功','success');await this.loadDashboard()}
  },
  async changePassword(){
    if(!this.pwForm.old_password||!this.pwForm.new_password){this.toastMsg('请填写完整','error');return}
    const d=await this.api('POST','/api/auth/change-password',this.pwForm);
    if(d){this.toastMsg('密码已修改','success');this.pwForm={old_password:'',new_password:''}}
  },

  // ===== Dashboard =====
  async loadDashboard(){const d=await this.api('GET','/api/dashboard');if(d)this.dash=d},
  async loadMediaLibrary(){const d=await this.api('GET','/api/media-library?limit=500');if(d){this.mediaItems=d.items||[];this.mediaTotal=d.total||0}},
  mediaSize(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(1)+' MB'},
  mediaKind(m){const n=String((m&&m.file)||'').toLowerCase();if(/\.(jpg|jpeg|png|gif|webp|bmp|avif)$/.test(n))return'image';if(/\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n))return'audio';return'unsupported'},
  async mediaBlob(m,inline=false){const r=await fetch('/api/media-library/'+encodeURIComponent(m.file)+(inline?'?inline=true':''),{headers:{'Authorization':'Bearer '+this.token}});if(r.status===401){this.token='';localStorage.removeItem('cr_token');this.toastMsg('登录已过期','error');return null}if(!r.ok){let d={};try{d=await r.json()}catch(e){}this.toastMsg(d.detail||'媒体读取失败','error');return null}return await r.blob()},
  async previewMedia(m){this.closeMediaPreview();const blob=await this.mediaBlob(m,true);if(!blob)return;this.mediaPreview={open:true,url:URL.createObjectURL(blob),kind:this.mediaKind(m),name:m.original_name||m.file,item:m}},
  closeMediaPreview(){if(this.mediaPreview.url)URL.revokeObjectURL(this.mediaPreview.url);this.mediaPreview={open:false,url:'',kind:'',name:'',item:null}},
  async downloadMedia(m){if(!m)return;const blob=await this.mediaBlob(m,false);if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=m.original_name||m.file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},

  // ===== Pairs =====
  async loadPairs(){const d=await this.api('GET','/api/pairs');if(d)this.pairs=d.pairs||[]},
  async createPair(){
    if(!this.newPairName){this.toastMsg('请输入名称','error');return}
    const d=await this.api('POST','/api/pairs',{name:this.newPairName,description:this.newPairDesc,direction:this.newPairDir,ai_trigger_side:this.newPairTrigger});
    if(d){this.toastMsg('创建成功','success');this.showCreatePair=false;this.newPairName='';this.newPairDesc='';await this.loadPairs()}
  },
  async openPair(id){
    this.page='pair';this.tab='accounts';this.qrImage=null;this.stopQrPoll();
    await this.loadPair(id);
    await Promise.all([this.loadAiModels(),this.loadPersonas(),this.loadWorldbooks(),this.loadKeywordSets(),this.loadToolSets()]);
  },
  async loadPair(id){
    const d=await this.api('GET','/api/pairs/'+id);
    if(d){if(!d.ai_trigger_side)d.ai_trigger_side='B';this.pair=d;this.quietCfg=d.quiet_hours||{enabled:false,start_time:'23:00',end_time:'07:00'}}
  },
  async startPair(id){const d=await this.api('POST','/api/pairs/'+id+'/start');if(d){this.toastMsg('已启动','success');await this.loadDashboard();await this.loadPairs();if(this.pair.id===id)await this.loadPair(id)}},
  async stopPair(id){const d=await this.api('POST','/api/pairs/'+id+'/stop');if(d){this.toastMsg('已停止','success');await this.loadDashboard();await this.loadPairs();if(this.pair.id===id)await this.loadPair(id)}},
  async restartPair(id){this.toastMsg('重启中...','info');const d=await this.api('POST','/api/pairs/'+id+'/restart');if(d){this.toastMsg('已重启','success');await this.loadPair(id)}},
  async deletePair(id){if(!confirm('确定删除此配对? 所有配置和消息记录将丢失!'))return;const d=await this.api('DELETE','/api/pairs/'+id);if(d){this.toastMsg('已删除','success');this.goPage('pairs')}},
  async clonePair(id){const d=await this.api('POST','/api/pairs/'+id+'/clone');if(d){this.toastMsg('克隆成功','success');await this.loadPairs()}},
  async savePairSettings(){
    const d=await this.api('PUT','/api/pairs/'+this.pair.id,{name:this.pair.name,description:this.pair.description,direction:this.pair.direction,ai_enabled:this.pair.ai_enabled,ai_trigger_side:this.pair.ai_trigger_side,auto_start:this.pair.auto_start,refresh_window_command:this.pair.refresh_window_command,max_consecutive_downlinks:this.pair.max_consecutive_downlinks});
    if(d)this.toastMsg('设置已保存','success');
  },
  async savePairResources(){
    const d=await this.api('PUT','/api/pairs/'+this.pair.id,{ai_model_id:this.pair.ai_model_id,persona_id:this.pair.persona_id,worldbook_id:this.pair.worldbook_id,keyword_set_id:this.pair.keyword_set_id,tool_set_id:this.pair.tool_set_id,vision_model_id:this.pair.vision_model_id});
    if(d){this.toastMsg('资源引用已保存','success');await this.loadPair(this.pair.id)}
  },

  // ===== Accounts =====
  async updateAccount(acc){const d=await this.api('PUT','/api/accounts/'+acc.id,{nickname:acc.nickname});if(d)this.toastMsg('已更新','success')},
  async startQrLogin(accId){
    this.qrAccountId=accId;this.qrStatus='wait';this.qrImage=null;
    const d=await this.api('POST','/api/accounts/'+accId+'/qr-login');
    if(d&&d.qr_image){this.qrImage=d.qr_image;this.startQrPoll(accId)}else{this.toastMsg('获取二维码失败','error')}
  },
  startQrPoll(accId){
    this.qrTimer=setInterval(async()=>{
      const d=await this.api('GET','/api/accounts/'+accId+'/qr-status');
      if(d){this.qrStatus=d.status;if(d.status==='confirmed'){this.stopQrPoll();this.toastMsg('登录成功!','success');await this.loadPair(this.pair.id)}else if(d.status==='expired'){this.stopQrPoll();this.toastMsg('二维码过期','error')}}
    },2000);
  },
  stopQrPoll(){if(this.qrTimer){clearInterval(this.qrTimer);this.qrTimer=null}},
  async logoutAccount(accId){if(!confirm('确定登出此账号?'))return;const d=await this.api('POST','/api/accounts/'+accId+'/logout');if(d){this.toastMsg('已登出','success');await this.loadPair(this.pair.id)}},

  // ===== AI Models =====
  async loadAiModels(){const d=await this.api('GET','/api/ai-models');if(d)this.aiModels=d.models||[]},
  async loadAiPresets(){const d=await this.api('GET','/api/ai-models/presets');if(d)this.aiPresets=d.presets||[]},
  openAiModel(m){
    if(m){this.aiModelEdit={...m,api_key:''}}
    else{this.aiModelEdit={name:'',provider:'deepseek',model:'deepseek-chat',api_key:'',base_url:'https://api.deepseek.com',temperature:0.8,max_tokens:500,system_prompt:'',ai_delay:4.0,context_length:20,force_split:true,split_max_len:15,emotion_aware:true,rag_enabled:true,tools_enabled:true}}
  },
  applyAiPreset(e){
    const i=e.target.value;if(i==='')return;
    const p=this.aiPresets[i];if(!p)return;
    this.aiModelEdit.provider=p.provider;this.aiModelEdit.model=p.model;this.aiModelEdit.base_url=p.base_url;
  },
  async saveAiModel(){
    const e=this.aiModelEdit;
    if(!e.name){this.toastMsg('请填写名称','error');return}
    const data={...e};delete data.id;delete data.api_key_masked;delete data.created_at;delete data.updated_at;
    if(!data.api_key)delete data.api_key;
    let d;
    if(e.id){d=await this.api('PUT','/api/ai-models/'+e.id,data)}
    else{d=await this.api('POST','/api/ai-models',data)}
    if(d){this.toastMsg('已保存','success');this.aiModelEdit=null;await this.loadAiModels()}
  },
  async testAiModel(id){this.toastMsg('测试中...','info');const d=await this.api('POST','/api/ai-models/'+id+'/test');if(d){this.toastMsg(d.message,d.status==='ok'?'success':'error')}},
  async deleteAiModel(id){if(!confirm('确定删除此模型?'))return;const d=await this.api('DELETE','/api/ai-models/'+id);if(d){this.toastMsg('已删除','success');this.aiModelEdit=null;await this.loadAiModels()}},

  // ===== Personas =====
  async loadPersonas(){const d=await this.api('GET','/api/personas');if(d)this.personas=d.personas||[]},
  openPersona(p){
    if(p){this.personaEdit={...p};if(!this.personaEdit.personality)this.personaEdit.personality=[];if(!this.personaEdit.example_dialogs)this.personaEdit.example_dialogs=[];if(!this.personaEdit.tags)this.personaEdit.tags=[]}
    else{this.personaEdit={name:'',description:'',personality:[],scenario:'',first_mes:'',example_dialogs:[],system_prompt_extra:'',tags:[]}}
    this.showImport='';this.importText='';
  },
  addPersonality(){if(this.newPersonality){this.personaEdit.personality.push(this.newPersonality);this.newPersonality=''}},
  addTag(){if(this.newTag){this.personaEdit.tags.push(this.newTag);this.newTag=''}},
  addDialog(){if(this.newDialogUser&&this.newDialogAssistant){this.personaEdit.example_dialogs.push({user:this.newDialogUser,assistant:this.newDialogAssistant});this.newDialogUser='';this.newDialogAssistant=''}},
  async savePersona(){
    const e=this.personaEdit;
    if(!e.name){this.toastMsg('请填写名称','error');return}
    const data={name:e.name,description:e.description,personality:e.personality,scenario:e.scenario,first_mes:e.first_mes,example_dialogs:e.example_dialogs,system_prompt_extra:e.system_prompt_extra,tags:e.tags};
    let d;
    if(e.id){d=await this.api('PUT','/api/personas/'+e.id,data)}
    else{d=await this.api('POST','/api/personas',data)}
    if(d){this.toastMsg('已保存','success');if(!e.id&&d.persona_id){await this.loadPersonas();const p=this.personas.find(x=>x.id===d.persona_id);if(p)this.openPersona(p)}else{this.personaEdit=null;await this.loadPersonas()}}
  },
  async deletePersona(id){if(!confirm('确定删除此人格?'))return;const d=await this.api('DELETE','/api/personas/'+id);if(d){this.toastMsg('已删除','success');this.personaEdit=null;await this.loadPersonas()}},

  // ===== Worldbooks =====
  async loadWorldbooks(){const d=await this.api('GET','/api/worldbooks');if(d)this.worldbooks=d.worldbooks||[]},
  async openWorldbook(wb){
    if(wb){const d=await this.api('GET','/api/worldbooks/'+wb.id);this.worldbookEdit=d||{...wb,entries:[]}}
    else{this.worldbookEdit={name:'',description:'',entries:[]}}
    this.showImport='';this.importText='';
  },
  async saveWorldbook(){
    const e=this.worldbookEdit;
    if(!e.name){this.toastMsg('请填写名称','error');return}
    let d;
    if(e.id){d=await this.api('PUT','/api/worldbooks/'+e.id,{name:e.name,description:e.description})}
    else{d=await this.api('POST','/api/worldbooks',{name:e.name,description:e.description})}
    if(d){this.toastMsg('已保存','success');if(!e.id&&d.worldbook_id){await this.loadWorldbooks();await this.openWorldbook({id:d.worldbook_id})}else{this.worldbookEdit=null;await this.loadWorldbooks()}}
  },
  async deleteWorldbook(id){if(!confirm('确定删除此世界书?'))return;const d=await this.api('DELETE','/api/worldbooks/'+id);if(d){this.toastMsg('已删除','success');this.worldbookEdit=null;await this.loadWorldbooks()}},
  async addWbEntry(){
    if(!this.newWb.key||!this.newWb.content){this.toastMsg('请填写关键词和内容','error');return}
    const d=await this.api('POST','/api/worldbooks/'+this.worldbookEdit.id+'/entries',this.newWb);
    if(d){this.toastMsg('已添加','success');this.newWb={key:'',content:'',priority:0};await this.openWorldbook({id:this.worldbookEdit.id})}
  },
  async toggleWbEntry(e){await this.api('PUT','/api/worldbooks/entries/'+e.id,{enabled:!e.enabled});await this.openWorldbook({id:this.worldbookEdit.id})},
  async deleteWbEntry(id){if(!confirm('删除此条目?'))return;await this.api('DELETE','/api/worldbooks/entries/'+id);await this.openWorldbook({id:this.worldbookEdit.id})},

  // ===== Keyword Sets =====
  async loadKeywordSets(){const d=await this.api('GET','/api/keyword-sets');if(d)this.keywordSets=d.sets||[]},
  async openKeywordSet(ks){
    if(ks){const d=await this.api('GET','/api/keyword-sets/'+ks.id);this.keywordSetEdit=d||{...ks,rules:[]}}
    else{this.keywordSetEdit={name:'',description:'',rules:[]}}
    this.showImport='';this.importText='';
  },
  async saveKeywordSet(){
    const e=this.keywordSetEdit;
    if(!e.name){this.toastMsg('请填写名称','error');return}
    let d;
    if(e.id){d=await this.api('PUT','/api/keyword-sets/'+e.id,{name:e.name,description:e.description})}
    else{d=await this.api('POST','/api/keyword-sets',{name:e.name,description:e.description})}
    if(d){this.toastMsg('已保存','success');if(!e.id&&d.set_id){await this.loadKeywordSets();await this.openKeywordSet({id:d.set_id})}else{this.keywordSetEdit=null;await this.loadKeywordSets()}}
  },
  async deleteKeywordSet(id){if(!confirm('确定删除此关键词集?'))return;const d=await this.api('DELETE','/api/keyword-sets/'+id);if(d){this.toastMsg('已删除','success');this.keywordSetEdit=null;await this.loadKeywordSets()}},
  async addKwRule(){
    if(!this.newKw.keyword||!this.newKw.reply){this.toastMsg('请填写关键词和回复','error');return}
    const d=await this.api('POST','/api/keyword-sets/'+this.keywordSetEdit.id+'/rules',this.newKw);
    if(d){this.toastMsg('已添加','success');this.newKw={keyword:'',reply:''};await this.openKeywordSet({id:this.keywordSetEdit.id})}
  },
  async toggleKwRule(r){await this.api('PUT','/api/keyword-sets/rules/'+r.id,{enabled:!r.enabled});await this.openKeywordSet({id:this.keywordSetEdit.id})},
  async deleteKwRule(id){if(!confirm('删除此规则?'))return;await this.api('DELETE','/api/keyword-sets/rules/'+id);await this.openKeywordSet({id:this.keywordSetEdit.id})},

  // ===== Tool Trigger Sets =====
  async loadToolSets(){const d=await this.api('GET','/api/tool-sets');if(d)this.toolSets=d.sets||[]},
  async loadToolsCatalog(){const d=await this.api('GET','/api/tools/catalog');if(d){this.toolsCatalog=d.tools||[];if(!this.newToolRule.tool_name&&this.toolsCatalog[0])this.newToolRule.tool_name=this.toolsCatalog[0].name}},
  toolLabel(name){const t=this.toolsCatalog.find(x=>x.name===name);return t?t.label:name},
  async openToolSet(ts){
    if(ts){const d=await this.api('GET','/api/tool-sets/'+ts.id);this.toolSetEdit=d||{...ts,rules:[]}}
    else{this.toolSetEdit={name:'',description:'',rules:[]}}
    this.newToolRule={tool_name:(this.toolsCatalog[0]||{}).name||'web_search',triggersText:'',match_mode:'prefix'};
  },
  async saveToolSet(){
    const e=this.toolSetEdit;if(!e.name){this.toastMsg('请填写名称','error');return}
    let d;if(e.id)d=await this.api('PUT','/api/tool-sets/'+e.id,{name:e.name,description:e.description});else d=await this.api('POST','/api/tool-sets',{name:e.name,description:e.description});
    if(d){this.toastMsg('已保存','success');if(!e.id&&d.set_id){await this.loadToolSets();await this.openToolSet({id:d.set_id})}else{this.toolSetEdit=null;await this.loadToolSets()}}
  },
  async deleteToolSet(id){if(!confirm('确定删除此工具触发词集?'))return;const d=await this.api('DELETE','/api/tool-sets/'+id);if(d){this.toastMsg('已删除','success');this.toolSetEdit=null;await this.loadToolSets()}},
  async addToolRule(){
    const e=this.toolSetEdit;const triggers=this.newToolRule.triggersText.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    if(!this.newToolRule.tool_name||!triggers.length){this.toastMsg('请选择工具并填写触发词','error');return}
    const tool=this.toolsCatalog.find(x=>x.name===this.newToolRule.tool_name)||{};
    const d=await this.api('POST','/api/tool-sets/'+e.id+'/rules',{tool_name:this.newToolRule.tool_name,triggers,match_mode:this.newToolRule.match_mode,args_template:tool.default_args||{},priority:0,enabled:true});
    if(d){this.toastMsg('已添加','success');this.newToolRule={tool_name:this.newToolRule.tool_name,triggersText:'',match_mode:'prefix'};await this.openToolSet({id:e.id})}
  },
  async toggleToolRule(r){await this.api('PUT','/api/tool-sets/rules/'+r.id,{enabled:!r.enabled});await this.openToolSet({id:this.toolSetEdit.id})},
  async deleteToolRule(id){if(!confirm('删除此工具规则?'))return;await this.api('DELETE','/api/tool-sets/rules/'+id);await this.openToolSet({id:this.toolSetEdit.id})},

  // ===== 模板下载 / 导入 =====
  downloadTemplate(type){
    let url='';
    if(type==='persona')url='/api/personas/'+this.personaEdit.id+'/template';
    if(type==='worldbook')url='/api/worldbooks/'+this.worldbookEdit.id+'/template';
    if(type==='keyword-set')url='/api/keyword-sets/'+this.keywordSetEdit.id+'/template';
    fetch(url,{headers:{'Authorization':'Bearer '+this.token}}).then(r=>r.blob()).then(b=>{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=type+'_template.md';a.click();
    });
  },
  async doImport(type){
    if(!this.importText.trim()){this.toastMsg('请粘贴内容','error');return}
    let text=this.importText.trim();
    // 提取 ```json ... ``` 代码块
    const m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
    if(m)text=m[1].trim();
    let data;
    try{data=JSON.parse(text)}catch(e){this.toastMsg('JSON 解析失败: '+e.message,'error');return}
    let url='';
    if(type==='persona')url='/api/personas/'+this.personaEdit.id+'/import';
    if(type==='worldbook')url='/api/worldbooks/'+this.worldbookEdit.id+'/import';
    if(type==='keyword-set')url='/api/keyword-sets/'+this.keywordSetEdit.id+'/import';
    const d=await this.api('POST',url,data);
    if(d){
      this.toastMsg(d.message||'导入成功','success');this.showImport='';this.importText='';
      if(type==='persona'){await this.loadPersonas();await this.openPersona({id:this.personaEdit.id})}
      if(type==='worldbook'){await this.loadWorldbooks();await this.openWorldbook({id:this.worldbookEdit.id})}
      if(type==='keyword-set'){await this.loadKeywordSets();await this.openKeywordSet({id:this.keywordSetEdit.id})}
    }
  },

  // ===== Quiet / Messages / Logs / Queue =====
  async saveQuiet(){const d=await this.api('PUT','/api/pairs/'+this.pair.id+'/quiet-hours',this.quietCfg);if(d)this.toastMsg('已保存','success')},
  async loadMessages(){const ai=this.msgFilter==='ai';const side=['A','B'].includes(this.msgFilter)?this.msgFilter:'';const d=await this.api('GET',`/api/pairs/${this.pair.id}/messages?limit=100&ai_only=${ai}&side=${side}`);if(d){this.messages=d.messages||[];this.msgStats=d.stats||{}}},
  async sendMessage(){if(!this.manualMsg.text){this.toastMsg('请输入消息','error');return}const d=await this.api('POST','/api/pairs/'+this.pair.id+'/messages/send',this.manualMsg);if(d){this.toastMsg('发送成功','success');this.manualMsg.text='';await this.loadMessages()}},
  async loadLogs(){const d=await this.api('GET','/api/pairs/'+this.pair.id+'/logs?limit=100');if(d)this.logs=d.logs||[]},
  toggleAutoRefresh(){if(this.autoRefresh){this.logTimer=setInterval(()=>this.loadLogs(),5000)}else{if(this.logTimer){clearInterval(this.logTimer);this.logTimer=null}}},
  async loadQueue(){const d=await this.api('GET','/api/pairs/'+this.pair.id+'/queue');if(d)this.queue=d},
  toggleQueueAuto(){if(this.queueAuto){this.queueTimer=setInterval(()=>this.loadQueue(),3000)}else{if(this.queueTimer){clearInterval(this.queueTimer);this.queueTimer=null}}},

  // ===== System Settings =====
  async loadSysCfg(){const d=await this.api('GET','/api/system/config');if(d)this.sysCfg=d},
  async loadUpdateStatus(){const d=await this.api('GET','/api/system/update-status');if(d)this.updateStatus=d},
  async loadVersion(){try{const r=await fetch('/api/system/version');const d=await r.json();this.appVer='v'+d.version;this.appBuild=d.build}catch(e){this.appVer='v?'}},
  async saveSysCfg(){const d=await this.api('PUT','/api/system/config',{update_url:this.sysCfg.update_url});if(d)this.toastMsg('已保存','success')},
  async doUpdate(){
    if(!this.sysCfg.update_url){this.toastMsg('请先填写更新源 URL','error');return}
    if(!confirm('确定从更新源下载并更新? 服务将自动重启.'))return;
    this.updating=true;
    const d=await this.api('POST','/api/system/update');
    if(d){this.toastMsg(d.message,'success');await this.loadUpdateStatus()}
    this.updating=false;
  },
  async uploadUpdate(e){
    const file=e.target.files[0];if(!file)return;
    if(!confirm('确定上传并更新? 服务将自动重启.'))return;
    const fd=new FormData();fd.append('file',file);
    this.updating=true;
    const d=await this.api('POST','/api/system/update-upload',fd,true);
    if(d){this.toastMsg(d.message,'success');await this.loadUpdateStatus()}
    this.updating=false;e.target.value='';
  },
},
watch:{
  tab(v){
    if(v==='messages')this.loadMessages();
    if(v==='logs')this.loadLogs();
    if(v==='queue')this.loadQueue();
  },
  page(){
    if(this.logTimer){clearInterval(this.logTimer);this.logTimer=null;this.autoRefresh=false}
    if(this.queueTimer){clearInterval(this.queueTimer);this.queueTimer=null;this.queueAuto=false}
  }
}
}).mount('#app');
</script>
</body>
</html>
